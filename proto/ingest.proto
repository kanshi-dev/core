syntax = "proto3";

package kanshi.ingest.v1;

option go_package = "github.com/kanshi-dev/core/proto/ingest/v1;ingest";

message Point {
  string name = 1;
  double value = 2;
  int64 timestamp_unix_nano = 3;
  repeated string tags = 4;
}

message AgentReport {
  string agent_id = 1;
  string hostname = 2;
  string os = 3;
  string platform = 4;
  string arch = 5;
  int32 cpu_cores = 6;
  int64 total_memory = 7;
  string version = 8;
  int64 disk_size = 9;
  repeated ProfileTarget profile_targets = 10;
}

message ProfileTarget {
  string name = 1;
  bool discovered = 2;
}

message Batch {
  string agent_id =1;
  repeated Point points = 2;
}

message Ack {
  int64 accepted = 1;
  ProfileCommand profile_command = 2;
}

message ProfileCommand {
  string capture_id = 1;
  string target_name = 2;
  string profile_type = 3;
  int32 duration_seconds = 4;
  int64 expires_unix_nano = 5;
}

message ProfileUpload {
  string capture_id = 1;
  string agent_id = 2;
  bytes artifact = 3;
  string filename = 4;
  string content_type = 5;
  string error = 6;
}

service IngestService {
  rpc IngestBatch(Batch) returns (Ack);
  rpc ReportAgent (AgentReport) returns (Ack);
  rpc UploadProfile (ProfileUpload) returns (Ack);
}
